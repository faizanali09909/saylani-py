<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marks Checker</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: #fff;
        padding: 35px;
        width: 350px;
        border-radius: 15px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      h2 {
        color: #333;
        margin-bottom: 20px;
      }

      p {
        color: #555;
        margin-bottom: 10px;
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 18px;
        outline: none;
        transition: 0.3s;
      }

      input:focus {
        border-color: #4f46e5;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #4338ca;
        transform: translateY(-2px);
      }

      #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        color: #4f46e5;
      }
    </style>

    <!-- Paste the CSS here -->
  </head>
  <body>
    <div class="container">
      <h2>📚 Marks Checker</h2>

      <p>Enter Your Marks</p>

      <input type="number" id="marksVal" placeholder="Enter marks (0-100)" />

      <button onclick="handleClick()">Submit</button>

      <p id="result"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
